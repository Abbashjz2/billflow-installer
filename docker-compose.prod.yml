name: ${COMPOSE_PROJECT_NAME:-billflow-bridge}
services:
  noc-server:
    image: ghcr.io/abbashjz2/billflow-bridge:${BRIDGE_VERSION}

    container_name: ${CONTAINER_NAME:-noc-server}
    hostname: ${CONTAINER_HOSTNAME:-bridge-server}
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "${BRIDGE_PORT:-3066}:3066"

    volumes:
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /:/host/root:ro
      - ${BRIDGE_DIR:-/opt/billflow-bridge}:/bridge-config

    environment:
      BRIDGE_ENV_FILE: /bridge-config/.env

    env_file:
      - .env