services:
  noc-server:
    image: ghcr.io/abbashjz2/billflow-bridge:${BRIDGE_VERSION}

    container_name: noc-server
    hostname: bridge-server
    restart: unless-stopped

    ports:
      - "3066:3066"

    volumes:
      # Linux host metrics and hardware information
      - /sys:/host/sys:ro

      # Host operating-system information
      - /etc/os-release:/host/etc/os-release:ro

      # Host filesystem for disk metrics
      - /:/host/root:ro

      # Writable Bridge configuration
      - /opt/billflow-bridge:/bridge-config

    environment:
      BRIDGE_ENV_FILE: /bridge-config/.env

    env_file:
      - .env